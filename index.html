<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CartoonAI — Studio Player</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 20px; }
  .box { width: 100%; max-width: 650px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; }
  h1 { margin-top: 0; font-size: 24px; color: #58a6ff; text-align: center; }
  textarea { width: 100%; height: 110px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; padding: 12px; font-size: 15px; margin-bottom: 12px; resize: none; }
  button { width: 100%; padding: 14px; background: #238636; border: 0; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 15px; padding: 12px; background: #0d1117; border-radius: 6px; font-size: 14px; text-align: center; color: #8b949e; }
  video { width: 100%; border-radius: 8px; margin-top: 15px; display: none; background: #000; }
  .download-btn { display: none; text-align: center; margin-top: 10px; padding: 10px; background: #1f6feb; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
</style>
</head>
<body>

<div class="box">
  <h1>🎬 CartoonAI Movie Maker</h1>
  <textarea id="prompt" placeholder="A cute 3D cartoon cat wearing a space helmet, exploring a pink glowing alien planet..."></textarea>
  <button id="btn" onclick="generate()">Generate 30s Cartoon Video</button>
  
  <div id="status" class="status">Ready to generate.</div>
  
  <video id="player" controls playsinline></video>
  <a id="download" class="download-btn" target="_blank" download>⬇️ Download Full Video Part 1</a>
</div>

<script>
async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const player = document.getElementById('player');
  const download = document.getElementById('download');

  if (!prompt) return alert("Please enter a prompt!");

  btn.disabled = true;
  player.style.display = "none";
  download.style.display = "none";
  status.innerText = "🚀 Sending request to AI server...";

  try {
    // 1. Create Job
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || "Failed to start generation");

    status.innerText = "🎬 Task Started! Generating Scene 1 (takes ~1-2 min)...";

    // 2. Poll Status
    await pollStatus(data.job_id);

  } catch (err) {
    status.innerText = "❌ Error: " + err.message;
    btn.disabled = false;
  }
}

async function pollStatus(jobId) {
  const status = document.getElementById('status');
  const btn = document.getElementById('btn');
  
  while (true) {
    await new Promise(r => setTimeout(r, 8000)); // check every 8 sec

    try {
      const res = await fetch(`/api/generate?job_id=${encodeURIComponent(jobId)}`);
      const data = await res.json();

      if (data.status === "scene1") {
        status.innerText = "⏳ Scene 1/2 is rendering...";
      } else if (data.status === "scene2") {
        status.innerText = "🎬 Scene 1 Done! Scene 2/2 is rendering...";
      } else if (data.status === "completed") {
        status.innerText = "✅ Video Ready! Playing continuous video...";
        playMovie(data.scene1_url, data.scene2_url);
        btn.disabled = false;
        break;
      } else if (data.status === "failed") {
        throw new Error(data.error || "Generation failed on Agnes server.");
      }
    } catch (err) {
      status.innerText = "❌ Error: " + err.message;
      btn.disabled = false;
      break;
    }
  }
}

function playMovie(s1, s2) {
  const player = document.getElementById('player');
  const download = document.getElementById('download');

  player.style.display = "block";
  download.style.display = "block";

  player.src = s1;
  download.href = s1;
  player.play();

  // Seamlessly switch to Scene 2 when Scene 1 finishes
  player.onended = () => {
    player.src = s2;
    download.href = s2;
    download.innerText = "⬇️ Download Full Video Part 2";
    player.play();
  };
}
</script>

</body>
</html>
